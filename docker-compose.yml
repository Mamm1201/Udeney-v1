version: "3.8"

services:
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: udeney_db
      MYSQL_USER: udeney_user
      MYSQL_PASSWORD: userpassword
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword",
        ]
      interval: 5s
      timeout: 30s
      retries: 10
    command: --wait_timeout=28800 --interactive_timeout=28800

  backend:
    build:
      context: .
    command: bash -c "while ! nc -z db 3306; do sleep 2; done && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: ecommerce.settings
      PYTHONUNBUFFERED: 1
      DB_HOST: db
      DB_NAME: udeney_db
      DB_USER: udeney_user
      DB_PASSWORD: userpassword
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./client
    command: npm run dev
    working_dir: /app
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
