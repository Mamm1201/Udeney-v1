version: "3.8"

services:
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD} # 🔐 Contraseña root desde .env
      MYSQL_DATABASE: ${DB_NAME} # 📂 Nombre real de la BD
      MYSQL_USER: ${DB_USER} # 👤 Usuario principal desde .env
      MYSQL_PASSWORD: ${DB_PASSWORD} # 🔐 Contraseña desde .env
    volumes:
      - db_data:/var/lib/mysql # 💾 Persistencia de datos
    ports:
      - "3307:3306" # 🌐 MySQL accesible en host

  backend:
    build:
      context: . # 📦 Dockerfile raíz del backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app # 🔁 Sincroniza código
    ports:
      - "8000:8000" # 🌍 Django disponible en localhost:8000
    environment:
      DJANGO_SETTINGS_MODULE: ecommerce.settings # ⚙️ Ajustes del proyecto Django
      PYTHONUNBUFFERED: 1 # 📤 Logs sin buffer
    env_file:
      - .env # ✅ Usa las variables definidas en .env
    depends_on:
      - db # ⏳ Espera a que MySQL esté listo

  frontend:
    build:
      context: ./client # 📁 Ruta del frontend (Vite)
    command: npm run dev
    working_dir: /app
    volumes:
      - ./client:/app # 🔁 Hot reload del frontend
      - /app/node_modules # ⚠️ Evita sobrescribir node_modules
    ports:
      - "5173:5173" # 🌐 Vite en este puerto
    depends_on:
      - backend # ⏳ Espera a backend

volumes:
  db_data: # 💽 Volumen persistente MySQL
