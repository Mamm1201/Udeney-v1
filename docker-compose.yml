version: "3.8"

services:
  db:
    image: mysql:8.0
    env_file:
      - .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10

  # Servicio del backend Django
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "./wait-for-it.sh db 3306 -- python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.vm
    restart: unless-stopped

  # Servicio del frontend Vite (React)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    working_dir: /app
    # volumes:
    #   - ./client:/app
    #   - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  db_data:
