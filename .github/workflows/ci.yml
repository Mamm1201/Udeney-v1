name: Python & Frontend CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      # 📥 1. Clona el repositorio
      - uses: actions/checkout@v4

      # 🐍 2. Configura Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # 💾 3. Cache de dependencias pip
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 📦 4. Instala herramientas de pip
      - name: Upgrade pip and install pip-tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools

      # 📄 5. Compila requirements.txt desde requirements.in
      - name: Compile requirements.txt desde requirements.in
        run: |
          pip-compile requirements.in

      # 📦 6. Instala dependencias del backend
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-django black flake8

      # 🧪 7. Corre pruebas y formato en el backend
      - name: Format code with Black (auto-fix)
        run: |
          black .

      - name: Run flake8 linter
        run: |
          flake8 .

      # 🌐 8. Configura Node.js para el frontend
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      # 📦 9. Instala dependencias del frontend
      - name: Install frontend dependencies
        run: |
          cd client
          npm install

      # 🧹 10. Linter y formato en frontend
      - name: Run ESLint
        run: |
          cd client
          npx eslint . --max-warnings=0

      - name: Format code with Prettier (auto-fix)
        run: |
          cd client
          npx prettier --write "**/*.{js,jsx,json,css,md}"

      # 📤 11. Subida de reportes de cobertura (opcional si usas pytest-cov)
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: ./coverage.xml
