name: CD - Deploy Udeney to Azure VM

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Azure VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.HOST }} << 'EOF'
            set -e
            sudo apt update

            # Instalar Docker Compose V2 manualmente si no existe
            if ! docker compose version &>/dev/null; then
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o docker-compose
              chmod +x docker-compose
              sudo mv docker-compose /usr/local/lib/docker/cli-plugins/docker-compose
            fi

            cd ${{ secrets.PROJECT_PATH }}
            git pull origin develop
            docker compose down
            docker compose up --build -d
          EOF
